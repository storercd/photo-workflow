[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-workflow"
version = "0.1.0"
description = "Daily photo processing workflows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlx-whisper>=0.4.3",
    "Pillow>=12.2",
]

[project.scripts]
photo-workflow-run = "photo_workflow.workflow:main"
photo-workflow-memory-card-copy = "photo_workflow.memory_card_copy:main"
photo-workflow-short-video-notes = "photo_workflow.video_notes:main"
photo-workflow-benchmark-transcription = "photo_workflow.video_notes:benchmark_main"
photo-workflow-install-font = "photo_workflow.video_notes:install_font_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=photo_workflow --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
output-format = "concise"
preview = true

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "PLW0602", # global variable not assigned
    "PLW0603", # global statement usage
    "I",       # isort
    "PLC0415", # import outside top-level
    "C90",     # McCabe complexity
    "DOC",  # pydoclint
    "D",    # pydocstyle
    "D213", # Multi-line docstring summary should start at the second line
]
ignore = [
    "D212",  # Multi-line docstring summary should start at the first line
    "D203",  # 1 blank line required before class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Enforce Google-style docstrings

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
