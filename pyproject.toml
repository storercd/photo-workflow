[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-workflow"
version = "0.1.0"
description = "Daily photo processing workflows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlx-whisper>=0.4.3",
    "Pillow>=12.2",
]

[project.scripts]
photo-workflow-run = "photo_workflow.workflow:main"
photo-workflow-memory-card-copy = "photo_workflow.memory_card_copy:main"
photo-workflow-short-video-notes = "photo_workflow.video_notes:main"
photo-workflow-install-font = "photo_workflow.video_notes:install_font_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=photo_workflow --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
