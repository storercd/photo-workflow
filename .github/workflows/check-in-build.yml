name: Check-in Build

# Runs on every branch push so pull requests always have an up-to-date,
# required status check available for branch protection on `development`.
on:
  push:
    branches:
      - '**'

jobs:
  build-test-lint:
    name: Build, test, and lint
    # mlx-whisper only ships wheels for Apple Silicon macOS, so CI must run
    # on an arm64 macOS runner.
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Build package
        run: uv build

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest
