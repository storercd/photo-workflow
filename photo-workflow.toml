[workflow]
camera_root = "/Users/christopherstorer/working/camera"

[memory_card_copy]
card_mount_root = "/Volumes"
low_disk_warning_gb = 30.0
low_disk_warning_percent = 5.0
copy_verification = "basic"
halt_on_insufficient_space = true
# TODO: perhaps it makes more sense to list the extensions we DO want to copy, rather than the ones we want to ignore?
ignored_extensions = [".ctg", ".log", ".tmp", ".fir", ".to3"]

[video_notes]
max_duration_seconds = 15.0
transcription_model = "mlx-community/whisper-medium-mlx"

[crop_tool]
aspect_ratios = ["1:1", "4:5", "1.91:1"]
snap_tolerance = 0.05
# When switching to a preset ratio, grow the hand-drawn crop instead of
# shrinking it (capped at the image bounds). Set to false to restore the
# old shrink-to-fit behavior.
grow_on_ratio_change = true

# Dashboard launcher icons. app_name is passed to `open -a` (macOS Launch Services),
# so it does not need to be an exact install path. Adjust names to match your
# installed app versions (e.g. Photoshop's year suffix).
[[dashboard.apps]]
name = "FastRawViewer"
app_name = "FastRawViewer"
supports_target_folder = true

[[dashboard.apps]]
name = "Photo Workflow Crop"
command = ["photo-workflow-crop"]
supports_target_folder = true

[[dashboard.apps]]
name = "Lightroom Classic"
app_name = "Adobe Lightroom Classic"

[[dashboard.apps]]
name = "Photoshop"
app_name = "Adobe Photoshop 2026"

[[dashboard.apps]]
name = "Aftershoot"
app_name = "Aftershoot"
